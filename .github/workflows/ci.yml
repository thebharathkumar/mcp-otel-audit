name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  report-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install "pytest>=8,<9"
      - name: Recompute REPORT.md headline numbers from committed captures
        run: python -m pytest tests/ -v
